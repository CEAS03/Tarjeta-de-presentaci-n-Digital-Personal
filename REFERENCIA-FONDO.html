<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referencia del fondo — tarjeta de Carlos</title>
</head>
<body>
<!--
═══════════════════════════════════════════════════════════════════════════════
  REFERENCIA VISUAL DEL FONDO — ESTO ES LO QUE CARLOS APROBÓ

  ⚠️ ACTUALIZADO EL 2026-08-05 POR LA NOCHE. LEE ESTO ANTES QUE NADA:

  El objetivo YA NO ES LA MEZCLA. Carlos vio las tres corriendo y decidió:
  **TOPOGRÁFICA PURA**. Sus palabras: «me encanta el fondo topográfico, que
  sean las líneas más finas y más definidas […] el tema de la mezcla es que
  las líneas se cruzan de lado a lado y eso no me encantó».
  La SEDA queda descartada: era la que producía esos cruces.

  Los valores que eligió en su teléfono, y que mandan sobre los de más abajo:
    DENS 33 · GROSOR 0.45 · NITIDEZ 0.7 · POT 4.5 · RELIEVE 0.04
    VEL 0.15 · PISO 0.01

  Y la inercia de la luz TAMBIÉN cambió — ver la nota de SUAVIZADO más abajo.

  La implementación viva está en `public/lab-fondo.html`, que es WebGL y ya
  reproduce esto. Este archivo se conserva como registro de cómo se llegó.

  ─────────────────────────────────────────────────────────────────────────
  Historia: Carlos vio siete direcciones y eligió DOS, mezcladas:
    · TOPOGRÁFICA  (prioritaria: manda el carácter de las líneas)
    · SEDA ESPECULAR (aporta el ondulado suave) — DESCARTADA la noche del 05

  ⚠️  ESTE ARCHIVO ES LA FUENTE DE VERDAD DEL ASPECTO DEL FONDO.
      No es decoración ni un experimento: es la referencia aprobada.
      Cualquier agente que reconstruya el fondo debe ABRIR ESTE ARCHIVO,
      mirarlo, y portarlo a WebGL conservando el aspecto. Si el resultado en
      WebGL no se parece a esto, el resultado está mal, no la referencia.

  ES CANVAS 2D A PROPÓSITO: es una maqueta. La versión final va en un shader
  de OGL (ver DISENO.md §7-bis), que debe verse IGUAL O MEJOR, nunca distinto.

  QUÉ LE GUSTÓ A CARLOS, EN SUS PALABRAS:
    · "el efecto de cómo vas moviendo y se van viendo los colores blanco o
       naranja y azul, eso se ve padrísimo"
    · las líneas de la topográfica
    · que no haya ningún objeto: ni esfera, ni mancha, ni partículas

  QUÉ PIDIÓ CAMBIAR:
    · [OBSOLETO] «LA LUZ DEBE MOVERSE MÁS LENTO» → SUAVIZADO 0.018, OMEGA 1.4.

      REVERTIDO EL 2026-08-05 POR LA NOCHE, tras probarlo en el teléfono real.
      Carlos: «quiero que la respuesta sea inmediata […] cuando muevo el
      teléfono se tarda como un segundo o un segundo y medio en reaccionar».
      Con OMEGA 1.4 el asentamiento del resorte es de ~3.3 s: era eso.

      VIGENTE:  OMEGA ≈ 14  (asentamiento ≈ 4.6/OMEGA ≈ 0.33 s)
                SENSIBILIDAD ≈ 12° para el recorrido completo (antes 32°)
                AUTOCALIBRADO: la primera lectura del sensor es el centro.

      El porqué de la sensibilidad, en sus palabras: «la gente, al agarrar el
      teléfono, casi no lo mueve; lo mueven apenas para identificar que
      funciona con el giroscopio».

      El resorte NO se elimina: sin él la señal del sensor tiembla. Solo pasa
      a ser rápido. Y con OMEGA alto hay que subdividir el paso de integración
      o el resorte se vuelve rígido y la luz da tirones.

  QUÉ LO MUEVE:
    · Las ondas se mueven SOLAS, lento y sin fin.
    · La LUZ la mueve el GIROSCOPIO del teléfono. Son dos movimientos
      independientes, y esa separación es la idea central: el fondo está vivo
      aunque no toques nada, pero el destello solo aparece si mueves el aparato.
    · En esta maqueta el cursor hace de giroscopio.

  LO QUE NO DEBE PASAR (Carlos lo reportó del intento anterior):
    · Rayas demasiado densas y duras. Si se ve a "código de barras", DENS está
      muy alto o el grosor no usa fwidth. Debe leerse a mapa topográfico, con
      aire entre líneas.
    · Que el fondo cambie y empeore al hacer scroll o al interactuar.
      El fondo NO reacciona al scroll. Solo a la inclinación.
═══════════════════════════════════════════════════════════════════════════════
-->

<div id="barra">
  <span>Marca</span>
  <button class="seg activo" data-m="hub">Hub</button>
  <button class="seg" data-m="alsai">ALSAI</button>
  <button class="seg" data-m="blindafon">Blindafón</button>
  <em>mueve el cursor despacio — es lo que hará el giroscopio</em>
</div>

<div id="rejilla">
  <figure><div class="marco"><canvas data-fx="topo"></canvas></div>
    <figcaption><b>TOPOGRÁFICA</b> — la que manda</figcaption></figure>
  <figure><div class="marco"><canvas data-fx="seda"></canvas></div>
    <figcaption><b>SEDA ESPECULAR</b> — el ondulado que se mezcla</figcaption></figure>
  <figure><div class="marco"><canvas data-fx="mezcla"></canvas></div>
    <figcaption><b>MEZCLA</b> — el objetivo final</figcaption></figure>
</div>

<style>
  body{margin:0;padding:24px;background:#111319;color:#e8e6e1;
       font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  #barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;font-size:13px}
  #barra span{opacity:.55;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
  #barra em{opacity:.4;font-style:normal;margin-left:auto;font-size:12px}
  .seg{border:1px solid #333a48;background:transparent;color:inherit;font:inherit;font-size:13px;
       padding:6px 14px;cursor:pointer;border-radius:7px}
  .seg.activo{background:#e8e6e1;color:#111319}
  #rejilla{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;max-width:820px}
  @media(max-width:720px){#rejilla{grid-template-columns:1fr}}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
  .marco{width:100%;max-width:230px;aspect-ratio:9/19;border-radius:26px;padding:5px;
         background:linear-gradient(160deg,#3a3f4a,#15181f 40%,#2a2e37)}
  canvas{display:block;width:100%;height:100%;border-radius:21px;background:#05070d}
  figcaption{font-size:12.5px;opacity:.65;text-align:center}
  figcaption b{opacity:1;font-weight:600}
</style>

<script>
(function(){
  /* ── Paletas: los MISMOS valores que src/config/paleta.ts y tokens.css ── */
  var PAL = {
    hub:       {bg:[5,7,13],   a1:[200,206,218], a2:[124,134,152]},
    alsai:     {bg:[4,10,22],  a1:[55,226,228],  a2:[27,143,155]},
    blindafon: {bg:[10,14,24], a1:[241,139,59],  a2:[79,195,255]}
  };

  /* ── LOS NÚMEROS QUE DEFINEN EL ASPECTO. Portar tal cual al shader. ── */
  var SUAVIZADO = 0.018; // ← inercia de la luz. BAJO A PROPÓSITO. En WebGL: OMEGA 1.4
  var DENS_TOPO = 34;    // líneas de la topográfica. Más alto = más denso. NO subir de 40.
  var POT_SPEC  = 11;    // dureza del brillo topográfico
  var N_SEDA    = 26;    // listones de la seda
  var POT_SEDA  = 7;     // brillo ANCHO: si sube, el destello parpadea en vez de barrer

  var cur={bg:PAL.hub.bg.slice(),a1:PAL.hub.a1.slice(),a2:PAL.hub.a2.slice()}, dst=PAL.hub;
  function lp(a,b,t){for(var i=0;i<3;i++)a[i]+=(b[i]-a[i])*t;}
  function C(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a.toFixed(3)+')';}
  function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

  document.querySelectorAll('.seg').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.seg').forEach(function(x){x.classList.remove('activo')});
      b.classList.add('activo'); dst=PAL[b.dataset.m];
    });
  });

  var esc=[], raton={x:0,y:0,hay:false};
  addEventListener('pointermove',function(e){raton.x=e.clientX;raton.y=e.clientY;raton.hay=true;});

  document.querySelectorAll('canvas[data-fx]').forEach(function(cv){
    var ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W=0,H=0,p={x:.5,y:.35};
    function medir(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;
      cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
    medir();addEventListener('resize',medir);
    esc.push({fx:cv.dataset.fx,c:ctx,cv:cv,p:p,w:function(){return W},h:function(){return H}});
  });

  var t0=performance.now();
  function frame(now){
    var t=(now-t0)/1000;
    lp(cur.bg,dst.bg,.05);lp(cur.a1,dst.a1,.05);lp(cur.a2,dst.a2,.05);

    esc.forEach(function(s){
      var c=s.c,W=s.w(),H=s.h(); if(!W)return;

      /* El cursor hace de giroscopio. En el teléfono esto es beta/gamma. */
      var r=s.cv.getBoundingClientRect(), tx=.5, ty=.35;
      if(raton.hay){
        tx=Math.max(-.8,Math.min(1.8,(raton.x-r.left)/r.width));
        ty=Math.max(-.8,Math.min(1.8,(raton.y-r.top)/r.height));
      }
      /* Deriva propia: el fondo vive aunque nadie lo toque. */
      tx+=Math.sin(t*.29)*.10; ty+=Math.cos(t*.21)*.10;
      s.p.x+=(tx-s.p.x)*SUAVIZADO; s.p.y+=(ty-s.p.y)*SUAVIZADO;
      var mx=s.p.x,my=s.p.y;

      /* Dirección de la luz. UNA sola. */
      var lx=(mx-.5)*2.2, ly=(my-.5)*2.2-.55;
      var ln=Math.hypot(lx,ly)||1; lx/=ln; ly/=ln;

      c.globalCompositeOperation='source-over';
      c.fillStyle=C(cur.bg,1); c.fillRect(0,0,W,H);
      c.globalCompositeOperation='lighter';

      /* ═══ TOPOGRÁFICA — curvas de nivel de un relieve invisible ═══ */
      if(s.fx==='topo'||s.fx==='mezcla'){
        var M = s.fx==='mezcla' ? Math.round(DENS_TOPO*0.8) : DENS_TOPO, paso=10;
        for(var k=0;k<M;k++){
          var f=k/M, yb=H*(.02+f*.98), prev=null;
          for(var x=-paso;x<=W+paso;x+=paso){
            var u=x/W, v=f;
            /* Campo de altura. En el shader esto es fbm + seno; aquí, dos senos. */
            var h = Math.sin(u*4.2+t*.28)*Math.cos(v*3.6-t*.20)
                  + Math.sin((u+v)*5.1-t*.16)*.55;
            var y=yb+h*H*.055+(my-.5)*22;
            if(prev){
              var dx=x-prev.x, dy=y-prev.y, m=Math.hypot(dx,dy)||1;
              var nx=-dy/m, ny=dx/m;              /* normal de la curva */
              var d=nx*lx+ny*ly; if(d<0)d=-d;
              var sp=Math.pow(d,POT_SPEC);
              /* EL RECORRIDO DE COLOR QUE LE GUSTÓ: a2 → a1 → blanco */
              var col = sp>.35 ? mix(cur.a1,[255,255,255],(sp-.35)*1.5)
                               : mix(cur.a2,cur.a1,sp*2.2);
              c.strokeStyle=C(col, .035+sp*.80);
              c.lineWidth=.85+sp*1.5;
              c.beginPath(); c.moveTo(prev.x,prev.y); c.lineTo(x,y); c.stroke();
            }
            prev={x:x,y:y};
          }
        }
      }

      /* ═══ SEDA ESPECULAR — pliegues largos que atrapan la luz ═══ */
      if(s.fx==='seda'||s.fx==='mezcla'){
        var N = s.fx==='mezcla' ? Math.round(N_SEDA*0.55) : N_SEDA;
        var opac = s.fx==='mezcla' ? 0.62 : 1;   /* en la mezcla, la seda acompaña */
        for(var k2=0;k2<N;k2++){
          var f2=k2/N;
          var amp=H*.075*(.45+f2*1.15);
          var yb2=H*(.06+f2*.90)+(my-.5)*34;
          var ph=t*.36+f2*5.8+(mx-.5)*1.2;
          var ancho=1.1+Math.sin(f2*9.4+t*.7)*.5+.7;
          var prev2=null;
          for(var x2=-11;x2<=W+11;x2+=11){
            var u2=x2/W;
            var y2=yb2+Math.sin(u2*3.0+ph)*amp+Math.sin(u2*7.1-ph*.72)*amp*.34;
            if(prev2){
              var dx2=x2-prev2.x, dy2=y2-prev2.y, m2=Math.hypot(dx2,dy2)||1;
              var nx2=-dy2/m2, ny2=dx2/m2;
              var d2=nx2*lx+ny2*ly; if(d2<0)d2=-d2;
              var spec=Math.pow(d2,POT_SEDA);
              var col2 = spec>.28 ? mix(cur.a1,[255,255,255],Math.min(1,(spec-.28)*1.7))
                                  : mix(cur.a2,cur.a1,Math.min(1,spec*2.6));
              c.strokeStyle=C(col2, (0.045+spec*.62)*opac);
              c.lineWidth=ancho*(1+spec*.9);
              c.beginPath(); c.moveTo(prev2.x,prev2.y); c.lineTo(x2,y2); c.stroke();
            }
            prev2={x:x2,y:y2};
          }
        }
      }

      /* Viñeta: hunde los bordes, sube el centro. Sin esto se ve plano. */
      c.globalCompositeOperation='source-over';
      var vg=c.createRadialGradient(W*.5,H*.45,W*.30,W*.5,H*.5,W*1.05);
      vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.50)');
      c.fillStyle=vg; c.fillRect(0,0,W,H);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
